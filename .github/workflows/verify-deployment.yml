name: Verify deployment

# Runs the deployed-site checks from a runner and publishes the output as an artifact.
# Manual only.

on:
  workflow_dispatch:
    inputs:
      url:
        description: The deployed address to check
        required: true
        default: https://zuki-web.vegasoft.workers.dev
      parts:
        description: Which booking parts to run, as a JSON array
        required: false
        default: '["persist", "capacity", "validation", "race", "limit", "second-address"]'
      checks:
        description: Run the page checks (curl, browser, Rich Results)
        type: boolean
        required: false
        default: true

jobs:
  checks:
    if: inputs.checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser and its driver are needed only here, so they are not a dependency of the site.
      - run: npm i --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - name: Checks with curl
        run: mkdir -p results && bash scripts/verify/curl.sh "${{ inputs.url }}" | tee results/curl.txt
      - name: Checks in a browser
        env:
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/verify/browser.mjs "${{ inputs.url }}" | tee results/browser.json
      - name: Rich Results test
        continue-on-error: true
        run: node scripts/verify/rich-results.mjs "${{ inputs.url }}/" | tee results/rich-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: results-checks
          path: results

  # The booking checks post to the live endpoint, which allows five posts per address per
  # ten minutes, so each part runs on its own runner and therefore from its own address.
  booking:
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Booking checks (${{ matrix.part }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p results && bash scripts/verify/booking.sh "${{ inputs.url }}" "${{ matrix.part }}" | tee "results/booking-${{ matrix.part }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: results-booking-${{ matrix.part }}
          path: results

  cleanup:
    needs: booking
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remove the test rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mkdir -p results && bash scripts/verify/booking.sh "${{ inputs.url }}" cleanup | tee results/booking-cleanup.txt
      - uses: actions/upload-artifact@v4
        with:
          name: results-cleanup
          path: results
