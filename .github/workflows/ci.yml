name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so the version is stated in exactly one place.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build must run before the type check, because it generates the route
      # types that TypeScript needs.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
